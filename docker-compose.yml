services:
  postgres:
    image: postgres:15-alpine
    container_name: referal_postgres
    restart: always
    environment:
      POSTGRES_USER: referal_user
      POSTGRES_PASSWORD: referal_password
      POSTGRES_DB: referal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: referal_redis
    restart: always
    ports:
      - "6379:6379"

  # Optional: Ollama LLM Container (Commented out to save ~3GB EC2 disk space)
  # Un-comment if you have 15GB+ EBS volume and GPU/CPU resources
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: referal_ollama
  #   restart: always
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: referal_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://referal_user:referal_password@postgres:5432/referal_db
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      JWT_SECRET: super_secret_jwt_key_referal_portal_2026
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: referal_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  # ollama_data:
